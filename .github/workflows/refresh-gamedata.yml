# Pulls the latest Pokémon GO game data from PvPoke (and form image IDs from PokeAPI) every Monday, commits it if
# anything changed, and redeploys the site. Can also be run by hand from the
# Actions tab when a big game update lands.
name: Refresh game data

on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: node scripts/build-gamedata.mjs

      - name: Commit and redeploy if the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/data; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Refresh Pokémon GO game data from PvPoke"
          git push
          # Pushes made by this workflow don't trigger other workflows, so start the deploy directly.
          gh workflow run deploy.yml
